name: Publish website update version
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/version.json'
permissions:
  contents: write
jobs:
  publish-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Update public release manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          VERSION="web-$(date -u +%Y%m%d%H%M%S)-${COMMIT_SHA:0:7}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          export VERSION="$VERSION"
          node -e 'const fs=require("fs"); const version=process.env.VERSION; fs.writeFileSync("downloads/version.json", JSON.stringify({version,releaseDate:new Date().toISOString().slice(0,10),message:"A new Eden Family School website update is available. Open the official site to review changes and download Eden Smart.",downloadUrl:"/downloads/eden-smart.apk"},null,2)+"\n")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/version.json
          git commit -m "chore: publish website update version [skip ci]" || exit 0
          git push
