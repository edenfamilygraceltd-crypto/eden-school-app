name: Publish website update version
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/version.json'
permissions:
  contents: write
jobs:
  publish-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Update public release manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SITE_VERSION="web-$(date -u +%Y%m%d%H%M%S)-${COMMIT_SHA:0:7}"
          export SITE_VERSION
          node -e 'const fs=require("fs"); const path="downloads/version.json"; let old={}; try { old=JSON.parse(fs.readFileSync(path,"utf8")); } catch (_) {} const manifest={siteVersion:process.env.SITE_VERSION,appVersion:old.appVersion||"1.0",appVersionCode:Number(old.appVersionCode||1),releaseDate:new Date().toISOString().slice(0,10),appMessage:old.appMessage||"Une nouvelle version d\u2019Eden Smart est disponible. T\u00e9l\u00e9chargez-la depuis le site officiel.",message:"Une mise \u00e0 jour du site Eden Family School est disponible.",downloadUrl:"/downloads/eden-smart.apk"}; fs.writeFileSync(path,JSON.stringify(manifest,null,2)+"\n")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/version.json
          git commit -m "chore: publish website update version [skip ci]" || exit 0
          git push
